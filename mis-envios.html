<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHUZ - Mis envíos</title>
  <link rel="stylesheet" href="css/mis-pedidos.css">
  <link rel="stylesheet" href="css/mis-envios.css?v=20260717-1">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#20e676">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
</head>
<body>
<header class="orders-header shipments-header">
  <div class="top-row">
    <a class="back" href="index.html" aria-label="Volver">←</a>
    <img src="assets/image/logo-bhuz.jpeg" class="orders-logo" alt="BHUZ">
  </div>
  <h1>Mis envíos</h1>
  <p>Consulta tus paquetes, recupera el seguimiento y gestiona los envíos activos.</p>
</header>

<section class="user-summary">
  <h2>Hola 👋</h2>
  <p id="shipmentsUserText">Cargando tus envíos...</p>
</section>

<section class="stats">
  <div class="stat-card"><span>Envíos realizados</span><strong id="totalShipments">0</strong></div>
  <div class="stat-card"><span>Envíos activos</span><strong id="activeShipments">0</strong></div>
  <div class="stat-card"><span>Último estado</span><strong id="lastShipmentStatus">-</strong></div>
</section>

<section class="orders-tabs shipments-tabs">
  <button class="tab-btn active" data-filter="all">Todos</button>
  <button class="tab-btn" data-filter="active">Activos</button>
  <button class="tab-btn" data-filter="delivered">Entregados</button>
  <button class="tab-btn" data-filter="cancelled">Cancelados</button>
</section>

<main class="orders-container shipments-container">
  <div id="shipmentsList"><article class="order-card">Cargando tus envíos…</article></div>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/mis-envios.js?v=20260717-4"></script>
<script src="/js/pwa.js?v=20260719-8"></script>
<script src="js/tracking.js?v=20260717-1"></script>
</body>
</html>
