<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BHUZ - Panel Repartidor</title>
  <link rel="stylesheet" href="css/panel-repartidor.css" />
</head>
<body>
  <main class="driver-app">
    <header class="driver-header">
      <div class="brand-box">
        <img src="assets/image/bhuz.png" alt="BHUZ" />
        <div>
          <strong>Repartidor</strong>
          <span id="driverStatusText">Disponible</span>
        </div>
      </div>

      <button id="toggleDriverStatusBtn" class="status-toggle" type="button">
        Pausar
      </button>
    </header>

    <section class="driver-main-card">
      <div id="mainFlowBox"></div>
    </section>

    <section class="quick-actions">
      <button class="quick-btn" data-panel="earnings" type="button">
        <span>💰</span>
        Ganancias
      </button>
      <button class="quick-btn" data-panel="history" type="button">
        <span>📦</span>
        Historial
      </button>
      <button class="quick-btn" data-panel="profile" type="button">
        <span>👤</span>
        Perfil
      </button>
      <a class="quick-btn" href="index.html">
        <span>🚪</span>
        Salir
      </a>
    </section>
  </main>

  <div id="sidePanel" class="side-panel" aria-hidden="true">
    <div class="side-panel-backdrop" data-close-panel="true"></div>
    <aside class="side-panel-content">
      <div class="side-panel-header">
        <h2 id="sidePanelTitle">Información</h2>
        <button class="close-panel-btn" data-close-panel="true" type="button">×</button>
      </div>
      <div id="sidePanelBody"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/auth.js"></script>
  <script src="js/panel-repartidor.js"></script>
</body>
</html>
