<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>BHUZ · Repartidor</title>
  <link rel="stylesheet" href="./css/panel-repartidor.css?v=20260717-1">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#20e676">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
</head>
<body class="driver-panel-body">
  <div class="driver-mobile-app">
    <header class="mobile-topbar">
      <div class="brand-lockup compact"><span class="brand-name">BHU<span>Z</span></span><small>REPARTIDOR</small></div>
      <div class="topbar-actions">
        <button class="icon-button" id="themeToggle" type="button" aria-label="Cambiar tema">☀</button>
        <button class="logout-button" id="logoutDriver" type="button" aria-label="Cerrar sesión"><span aria-hidden="true">⎋</span><strong>Salir</strong></button>
      </div>
    </header>

    <main class="driver-content">
      <header class="driver-welcome">
        <div><span class="section-kicker">CENTRO DE OPERACIONES</span><h1 id="viewTitle">Mi jornada</h1><p id="welcomeName">Hola, repartidor 👋</p></div>
        <div class="availability-card">
          <div><strong id="availabilityText">No disponible</strong><small>Activa tu jornada para recibir pedidos.</small></div>
          <button id="availabilityToggle" class="availability-toggle" type="button" aria-label="Cambiar disponibilidad"></button>
        </div>
      </header>

      <section id="gpsStatus" class="gps-strip" hidden>
        <span class="gps-dot"></span><div><strong id="gpsStatusTitle">GPS activo</strong><small id="gpsStatusText">Calculando tu ubicación…</small></div>
      </section>

      <section id="driverStats" class="stats-grid"></section>
      <section id="inicioView" class="driver-view active"></section>
      <section id="entregasView" class="driver-view"></section>
      <section id="finanzasView" class="driver-view"></section>
      <section id="cierresView" class="driver-view"></section>
      <section id="perfilView" class="driver-view"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="side-link active" data-view="inicio"><span>⌂</span><small>Inicio</small></button>
      <button class="side-link" data-view="entregas"><span>▦</span><small>Entregas</small></button>
      <button class="side-link" data-view="finanzas"><span>$</span><small>Finanzas</small></button>
      <button class="side-link" data-view="cierres"><span>✓</span><small>Cierres</small></button>
      <button class="side-link" data-view="perfil"><span>○</span><small>Perfil</small></button>
    </nav>
  </div>
  <div id="driverToast" class="driver-toast" aria-live="polite"></div>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/panel-repartidor.js?v=20260717-1"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/tracking.js"></script>
</body>
</html>
