<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BHUZ - Panel Repartidor</title>
  <link rel="stylesheet" href="css/panel-repartidor.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="openMenuBtn" class="icon-btn" type="button" aria-label="Abrir menú">☰</button>
      <img class="brand-logo" src="assets/image/bhuz.png" alt="BHUZ" />
      <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Cambiar modo">☀</button>
    </header>

    <main class="driver-main">
      <section id="homeView" class="view active"></section>
      <section id="deliveriesView" class="view"></section>
      <section id="earningsView" class="view"></section>
      <section id="profileView" class="view"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación repartidor">
      <button class="nav-btn active" data-view="home" type="button">
        <span>⌂</span>
        Inicio
      </button>
      <button class="nav-btn" data-view="deliveries" type="button">
        <span>▦</span>
        Entregas
      </button>
      <button class="nav-btn" data-view="earnings" type="button">
        <span>▣</span>
        Ganancias
      </button>
      <button class="nav-btn" data-view="profile" type="button">
        <span>○</span>
        Perfil
      </button>
    </nav>
  </div>

  <aside id="sideMenu" class="side-menu" aria-hidden="true">
    <div class="menu-overlay" data-close-menu="true"></div>
    <div class="menu-panel">
      <div class="menu-profile">
        <div class="avatar">R</div>
        <div>
          <strong id="menuDriverName">Repartidor BHUZ</strong>
          <span>Ver perfil</span>
        </div>
      </div>

      <div class="menu-list">
        <button data-menu-view="deliveries" type="button">📦 Mis entregas <span>Historial de pedidos</span></button>
        <button data-menu-view="earnings" type="button">💰 Ganancias <span>Resumen de ingresos</span></button>
        <button data-menu-view="profile" type="button">👤 Perfil <span>Mi información</span></button>
        <button type="button" disabled>📍 Zonas de trabajo <span>Próximamente</span></button>
        <button type="button" disabled>🎧 Soporte <span>Próximamente</span></button>
        <button type="button" disabled>⚙ Configuración <span>Próximamente</span></button>
      </div>

      <a class="logout-link" href="index.html">Cerrar sesión</a>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/auth.js"></script>
  <script src="js/panel-repartidor.js"></script>
</body>
</html>
