<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BHUZ · Acceso repartidor</title><link rel="stylesheet" href="css/panel-repartidor.css"></head><body class="driver-access-body">
<main class="driver-access"><img src="assets/image/bhuz.png" alt="BHUZ" class="access-logo"><section class="access-card"><div class="access-tabs"><button class="active" data-access-tab="login">Ingresar</button><button data-access-tab="register">Crear cuenta</button></div>
<form id="driverLoginForm" class="access-form active"><h1>Panel repartidor</h1><p>Ingresa a tu jornada, entregas y liquidaciones.</p><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required></label><button class="btn btn-green">Ingresar</button></form>
<form id="driverRegisterForm" class="access-form"><h1>Registro de repartidor</h1><div class="form-grid"><label>Nombre completo<input name="fullName" required></label><label>Teléfono<input name="phone" required></label><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required></label><label>Cédula<input name="identityDocument"></label><label>País<select name="countryCode"><option value="VE">Venezuela</option><option value="CL">Chile</option><option value="AR">Argentina</option><option value="PE">Perú</option><option value="CO">Colombia</option></select></label><label>Ciudad<input name="city" value="Punto Fijo"></label><label>Zona<input name="zone"></label><label>Vehículo<select name="vehicleType"><option>Moto</option><option>Bicicleta</option><option>Automóvil</option><option>A pie</option></select></label><label>Placa<input name="vehiclePlate"></label></div><button class="btn btn-green">Enviar registro</button></form><p id="accessMessage" class="access-message"></p></section></main>
<script src="js/config.js"></script><script src="js/acceso-repartidor.js"></script></body></html>
