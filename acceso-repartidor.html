<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>BHUZ · Acceso repartidor</title>
  <link rel="stylesheet" href="/css/panel-repartidor.css?v=20260711-4">
  <style>
:root{
  --bg:#07110d;--surface:#0d1b15;--surface-2:#12261d;--surface-3:#172f24;
  --text:#f6fff8;--muted:#9fb5a7;--line:#234434;--green:#20e56f;--green-2:#0abf55;
  --danger:#ff6b6b;--warning:#ffbf69;--shadow:0 16px 48px rgba(0,0,0,.32);
}
html[data-theme="light"]{
  --bg:#eef4f0;--surface:#ffffff;--surface-2:#f1f7f3;--surface-3:#e5f2ea;
  --text:#112219;--muted:#607268;--line:#cedfd5;--green:#08b957;--green-2:#069246;
  --shadow:0 16px 48px rgba(18,52,34,.12)
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.brand-lockup{display:inline-flex;flex-direction:column;line-height:.9}
.brand-name{font-weight:950;font-style:italic;letter-spacing:-.06em;font-size:42px;color:var(--text)}
.brand-name span{color:var(--green)}
.brand-lockup small{margin-top:7px;letter-spacing:.32em;color:var(--green);font-size:9px;font-weight:900}
.brand-lockup.compact .brand-name{font-size:28px}.brand-lockup.compact small{font-size:7px;margin-top:5px}
.icon-button{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;font-weight:900}
.section-kicker{display:block;font-size:10px;letter-spacing:.15em;color:var(--green);font-weight:900;margin-bottom:7px}
h1,h2,h3,p{margin-top:0}h1{font-size:27px;line-height:1.05;margin-bottom:7px}h2{font-size:19px}h3{font-size:16px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 16px;cursor:pointer;font-weight:900;min-height:46px}
.btn:disabled{cursor:not-allowed;opacity:.45;filter:saturate(.4)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green-2));color:#031a0c;box-shadow:0 9px 22px rgba(32,229,111,.2)}
.btn-dark{background:var(--surface-3);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:rgba(255,107,107,.13);color:#ff9e9e;border:1px solid rgba(255,107,107,.28)}
.btn-block{width:100%}
.field-label,.field{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:800}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:13px;padding:12px 13px;outline:none;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(32,229,111,.13)}

/* ACCESO: móvil primero */
.driver-access-body{min-height:100svh;background:radial-gradient(circle at 80% 0,rgba(32,229,111,.14),transparent 32%),var(--bg);padding:20px 14px;display:grid;place-items:center}
.driver-access-shell{width:min(100%,440px)}
.access-header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 18px}
.access-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.access-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:var(--surface-2);padding:5px;border-radius:15px;margin-bottom:22px}
.access-tabs button{border:0;border-radius:11px;background:transparent;color:var(--muted);padding:11px 9px;font-weight:900;cursor:pointer}
.access-tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 5px 16px rgba(0,0,0,.14)}
.access-form{display:none}.access-form.active{display:block}.access-form .field-label{margin-bottom:13px}
.access-intro p{color:var(--muted);line-height:1.5;margin-bottom:20px}.access-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:15px}
.access-message{min-height:20px;color:var(--warning);font-size:13px;margin:14px 2px 0}

/* APP MÓVIL */
.driver-panel-body{background:var(--bg);padding:0}
.driver-mobile-app{width:100%;min-height:100svh;background:var(--bg);padding-bottom:86px}
.mobile-topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-actions{display:flex;gap:8px}.driver-content{padding:18px 14px 28px}.driver-welcome{display:grid;gap:14px;margin-bottom:15px}.driver-welcome p{color:var(--muted);font-size:13px}
.availability-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.availability-card strong,.availability-card small{display:block}.availability-card small{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35}
.availability-toggle{flex:0 0 auto;width:56px;height:32px;border-radius:999px;background:#44544b;border:0;position:relative;cursor:pointer}
.availability-toggle::after{content:"";position:absolute;width:24px;height:24px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}
.availability-toggle.on{background:var(--green)}.availability-toggle.on::after{left:28px}
.gps-strip{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;margin-bottom:14px}
.gps-strip strong,.gps-strip small{display:block}.gps-strip small{color:var(--muted);font-size:11px;margin-top:3px}.gps-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(32,229,111,.13)}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat-card,.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px}.stat-card span{font-size:11px;color:var(--muted)}.stat-card strong{display:block;font-size:22px;margin-top:6px}.driver-view{display:none}.driver-view.active{display:block}
.grid-2{display:grid;grid-template-columns:1fr;gap:14px}.job-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.job-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{display:inline-flex;border-radius:999px;padding:6px 9px;background:rgba(32,229,111,.12);color:var(--green);font-size:10px;font-weight:900}
.job-route{display:grid;gap:12px;margin:15px 0}.route-row{display:grid;grid-template-columns:13px 1fr;gap:10px}.route-row strong{font-size:13px}.route-row small{display:block;color:var(--muted);line-height:1.45;margin-top:3px}.route-dot{width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:4px}.route-row:last-child .route-dot{background:var(--warning)}
.job-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0}.mini-box{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}.mini-box span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.04em}.mini-box b{font-size:12px;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
.action-row{display:grid;grid-template-columns:1fr;gap:9px}.geo-help{font-size:11px;color:var(--muted);line-height:1.45;margin:9px 2px 0}.geo-help.ok{color:var(--green)}.geo-help.warn{color:var(--warning)}
.table-wrap{overflow:auto;border-radius:13px}.data-table{border-collapse:collapse;width:100%;min-width:660px}.data-table th,.data-table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap}.data-table th{color:var(--muted);font-size:10px}
.form-grid,.filters{display:grid;grid-template-columns:1fr;gap:11px}.settlement-preview{margin-top:13px}.positive{color:var(--green)}.negative{color:#ff8f8f}.empty{padding:26px 14px;text-align:center;color:var(--muted)}
.bottom-nav{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.side-link{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:3px;padding:7px 2px;border-radius:12px;cursor:pointer}.side-link span{font-size:18px;font-weight:900}.side-link small{font-size:9px}.side-link.active{color:var(--green);background:rgba(32,229,111,.08)}
.driver-toast{position:fixed;z-index:80;left:14px;right:14px;bottom:88px;background:var(--surface-3);border:1px solid var(--green);color:var(--text);padding:13px 15px;border-radius:14px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;text-align:center;font-weight:800}.driver-toast.show{opacity:1;transform:none}

@media(min-width:500px){
  .driver-panel-body{padding:18px 0}.driver-mobile-app{max-width:480px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:var(--shadow)}
  .bottom-nav{left:50%;right:auto;width:480px;transform:translateX(-50%)}
  .driver-toast{left:50%;right:auto;width:430px;transform:translate(-50%,12px)}.driver-toast.show{transform:translate(-50%,0)}
}
@media(min-width:700px){.access-grid{grid-template-columns:1fr 1fr}.driver-access-shell{width:min(100%,720px)}}

  </style>
</head>
<body class="driver-access-body">
  <main class="driver-access-shell">
    <header class="access-header">
      <div class="brand-lockup" aria-label="BHUZ Repartidor">
        <span class="brand-name">BHU<span>Z</span></span>
        <small>REPARTIDOR</small>
      </div>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Cambiar tema">☀</button>
    </header>

    <section class="access-card">
      <div class="access-tabs" role="tablist">
        <button class="active" type="button" data-access-tab="login">Ingresar</button>
        <button type="button" data-access-tab="register">Crear cuenta</button>
      </div>

      <form id="driverLoginForm" class="access-form active" autocomplete="on">
        <div class="access-intro">
          <span class="section-kicker">TU JORNADA BHUZ</span>
          <h1>Panel repartidor</h1>
          <p>Ingresa para administrar entregas, ganancias y liquidaciones.</p>
        </div>
        <label class="field-label">Correo electrónico
          <input name="email" type="email" inputmode="email" autocomplete="email" placeholder="repartidor@email.com" required>
        </label>
        <label class="field-label">Contraseña
          <input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>
        <button class="btn btn-green btn-block" type="submit">Ingresar</button>
      </form>

      <form id="driverRegisterForm" class="access-form" autocomplete="on">
        <div class="access-intro">
          <span class="section-kicker">NUEVO REPARTIDOR</span>
          <h1>Crear cuenta</h1>
          <p>Completa tus datos para registrarte en BHUZ.</p>
        </div>
        <div class="form-grid access-grid">
          <label class="field-label">Nombre completo<input name="fullName" autocomplete="name" required></label>
          <label class="field-label">Teléfono<input name="phone" inputmode="tel" autocomplete="tel" required></label>
          <label class="field-label">Correo<input name="email" type="email" inputmode="email" autocomplete="email" required></label>
          <label class="field-label">Contraseña<input name="password" type="password" autocomplete="new-password" required></label>
          <label class="field-label">Cédula<input name="identityDocument"></label>
          <label class="field-label">País
            <select name="countryCode">
              <option value="VE">Venezuela</option><option value="CL">Chile</option><option value="AR">Argentina</option><option value="PE">Perú</option><option value="CO">Colombia</option>
            </select>
          </label>
          <label class="field-label">Ciudad<input name="city" value="Punto Fijo"></label>
          <label class="field-label">Zona<input name="zone"></label>
          <label class="field-label">Vehículo
            <select name="vehicleType"><option>Moto</option><option>Bicicleta</option><option>Automóvil</option><option>A pie</option></select>
          </label>
          <label class="field-label">Placa<input name="vehiclePlate"></label>
        </div>
        <button class="btn btn-green btn-block" type="submit">Enviar registro</button>
      </form>
      <p id="accessMessage" class="access-message" aria-live="polite"></p>
    </section>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/acceso-repartidor.js?v=20260711-4"></script>
</body>
</html>
