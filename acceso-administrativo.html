<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELI GO. - Admin Login</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>
        body {
            background: var(--color-fondo);
        }

        .admin-login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .admin-login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .admin-login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .admin-login-container button {
            width: 100%;
            padding: 12px;
            background: var(--color-principal);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .error-msg {
            color: red;
            font-size: 13px;
            text-align: center;
        }

        .logo-admin {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 20px;
        }

        .logo-admin span {
            background: var(--color-principal);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            margin-left: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="admin-login-container">

    <div class="logo-admin">
        DELI GO <span>ADMIN</span>
    </div>

    <h2>Acceso Administrativo</h2>

    <input type="email" id="adminEmail" placeholder="Correo electrónico">
    <input type="password" id="adminPassword" placeholder="Contraseña">

    <button onclick="loginAdmin()">Ingresar</button>

    <div id="errorMsg" class="error-msg"></div>

</div>

<script>
async function loginAdmin() {
    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.textContent = "";

    if (!email || !password) {
        errorMsg.textContent = "Completa todos los campos";
        return;
    }

    try {
        const response = await fetch("https://deligo-backend-i554.onrender.com/admin/login", { 
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!data.ok) {
            errorMsg.textContent = data.message || "Error al iniciar sesión";
            return;
        }

        if (data.sessionToken) {
            sessionStorage.setItem("deliAdminSessionToken", data.sessionToken);
        }

        window.location.href = "panel-administrativo.html";

    } catch (error) {
        console.error(error);
        errorMsg.textContent = "Error conectando con el servidor";
    }
}
</script>

</body>
</html>
